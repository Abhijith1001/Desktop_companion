# Render Blueprint for the Desktop Buddy sync server.
# Render dashboard -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: desktop-buddy-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false # entered in the dashboard; never committed
      - key: ADMIN_TOKEN
        sync: false # admin panel password (24+ chars); leave empty to disable /admin
