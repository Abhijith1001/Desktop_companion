# Render Blueprint for the Desktop Buddy sync server and landing page.
# Render dashboard -> New -> Blueprint -> pick this repo.
services:
  # Landing page (site/) at https://desktop-buddy.onrender.com. Assembled the
  # same way as .github/workflows/pages.yml: the buddy art comes from the app.
  - type: web
    name: desktop-buddy
    runtime: static
    buildCommand: >-
      rm -rf _site && mkdir -p _site/buddy &&
      cp -r site/. _site/ &&
      cp electron/pet/characters.js electron/pet/buddy.css _site/buddy/ &&
      cp build/icon.png _site/favicon.png
    staticPublishPath: _site
    buildFilter:
      paths: ['site/**', 'electron/pet/characters.js', 'electron/pet/buddy.css', 'build/icon.png']
    headers:
      - path: /cat/*
        name: Cache-Control
        value: public, max-age=604800

  - type: web
    name: desktop-buddy-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false # entered in the dashboard; never committed
      - key: ADMIN_TOKEN
        sync: false # admin panel password (24+ chars); leave empty to disable /admin
