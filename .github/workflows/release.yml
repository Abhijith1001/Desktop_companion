# Builds the Windows installer and publishes it as a GitHub Release whenever a
# version tag is pushed. Installed apps pick the release up through
# electron-updater, and the landing page's download button points at it.
#
#   npm version minor        # bumps package.json and creates tag v2.2.0
#   git push --follow-tags
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # create the release and upload the installer

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm run test:unit

      - name: Check tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} does not match package.json version $v"; exit 1; }

      - name: Build and publish installer
        run: npm run dist:publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Code signing is optional; RELEASING.md shows how to add Azure Trusted Signing here.

      - name: Upload installer as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: release/*.exe
          retention-days: 14

      # After the first manual winget submission (RELEASING.md), each release
      # opens a winget-pkgs pull request automatically. Needs a WINGET_TOKEN
      # secret: a classic GitHub token with the public_repo scope.
      - name: Update winget package
        if: startsWith(github.ref, 'refs/tags/v') && env.WINGET_TOKEN != ''
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          $url = "https://github.com/Abhijith1001/Desktop_companion/releases/download/v$v/Desktop-Buddy-Setup-$v.exe"
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          .\wingetcreate.exe update Devwerks.DesktopBuddy --version $v --urls $url --token $env:WINGET_TOKEN --submit
